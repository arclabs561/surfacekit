[package]
name = "surfacekit"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Surface-neutral observation and evidence packets for agentic testing."
keywords = ["testing", "terminal", "pty", "agent"]
categories = ["development-tools::testing"]
readme = "README.md"
repository = "https://github.com/arclabs561/surfacekit"

[features]
default = ["term", "scenario", "judge"]
# Real PTY, VT100 screen, workspace diff, and recording.
term = [
    "dep:crossterm",
    "dep:libc",
    "dep:nix",
    "dep:rexpect",
    "dep:sha2",
    "dep:vt100",
]
# Clause-bound scenarios and append-only evidence records.
scenario = ["term"]
# Deterministic checks and the provider-neutral judge seam.
judge = ["scenario"]

[dependencies]
crossterm = { version = "0.28", optional = true }
libc = { version = "0.2", optional = true }
nix = { version = "0.31", default-features = false, features = ["fs", "term", "signal", "user"], optional = true }
rexpect = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
vt100 = { version = "0.16", optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
tempfile = "3"

[[test]]
name = "live_pairwise"
required-features = ["judge"]
